<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#0e101f"/>
      <stop offset="100%" stop-color="#070913"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background (iOS icon style) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
  
  <!-- Outer Soundwaves -->
  <g stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.4" filter="url(#glow)">
    <path d="M120 180 A160 160 0 0 0 120 332"/>
    <path d="M392 180 A160 160 0 0 1 392 332"/>
  </g>
  <g stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M160 210 A110 110 0 0 0 160 302"/>
    <path d="M352 210 A110 110 0 0 1 352 302"/>
  </g>

  <!-- Podcast Microphone / Antenna Body -->
  <g fill="url(#accentGrad)">
    <!-- Capsule -->
    <rect x="220" y="150" width="72" height="130" rx="36" />
    <!-- Stand Arc -->
    <path d="M190 240 C190 300 322 300 322 240" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round"/>
    <!-- Stem & Base -->
    <line x1="256" y1="300" x2="256" y2="350" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round"/>
    <line x1="210" y1="350" x2="302" y2="350" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round"/>
  </g>
  
  <!-- Capsule highlight -->
  <rect x="230" y="160" width="20" height="50" rx="10" fill="rgba(255,255,255,0.3)"/>

  <!-- Ad-Shield Badge at Top-Right -->
  <g transform="translate(320, 90)" filter="url(#glow)">
    <circle cx="45" cy="45" r="45" fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="6"/>
    <!-- Lightning Bolt (Auto-Skip / Shield) -->
    <path d="M48 20 L28 46 L44 46 L38 72 L62 42 L48 42 Z" fill="url(#shieldGrad)"/>
  </g>
</svg>
